name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 开发/测试工具链要求 Node >= 22:pnpm 11 在 Node 20 上无法启动
      # (ERR_UNKNOWN_BUILTIN_MODULE),且测试直接 import .ts 依赖类型剥离。
      # 装进 profile 的 lib/ 是纯 JS,运行时不受此限制(见 package.json engines)。
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: tests
        run: pnpm test
      - name: build
        run: pnpm build
      - name: packaging assertion (README/LICENSE must ship)
        run: pnpm pack:check
